<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HIPMI Telkom University — Photobooth Experience</title>
    <meta name="description" content="Official interactive event photobooth experience for HIPMI PT Telkom University Purwokerto. Fast, modern, responsive, high-definition." />
    
    <!-- PWA / Booth Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B0C0E" />
    <link rel="icon" type="image/png" href="/assets/logo-hipmi.png" />

    <!-- DNS Prefetch & Preconnect for Fast Assets & Cloud CDN -->
    <link rel="dns-prefetch" href="https://iili.io" />
    <link rel="preconnect" href="https://iili.io" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload Critical Brand & Frame Assets for 0ms Rendering Latency -->
    <link rel="preload" as="image" href="/assets/logo-hipmi.png" />
    <link rel="preload" as="image" href="/assets/logo-telu.png" />
    <link rel="preload" as="image" href="/assets/templates/frame-pkkmb-gold.png" />
    <link rel="preload" as="image" href="/assets/templates/frame-pkkmb-grunge.png" />
    <link rel="preload" as="image" href="/assets/templates/frame-pkkmb-single.png" />

    <!-- Google Fonts: Inter Display & Text -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
